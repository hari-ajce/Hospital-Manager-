<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Inventory Manager</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <span class="icon">🏥</span>
            <h1>PulseTrack | ICU & Equipment Manager</h1>
        </div>
        <div class="stats-summary">
            <div class="stat-badge danger">ICU Occupancy: <span id="icu-occupancy">0%</span></div>
            <div class="stat-badge warning">Ventilators Free: <span id="vent-free">0</span></div>
            <div class="stat-badge success">Total Free Beds: <span id="total-free">0</span></div>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <div class="card">
                <h3>⚡ Emergency Allocation</h3>
                <form id="allocate-form">
                    <div class="form-group">
                        <label>Patient Name</label>
                        <input type="text" id="patient-name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Triage Urgency Score (1-10)</label>
                        <input type="number" id="urgency-score" min="1" max="10" value="5" required>
                    </div>
                    <div class="form-group">
                        <label>Resource Required</label>
                        <select id="resource-type">
                            <option value="ICU">ICU Bed</option>
                            <option value="VENTILATOR">Ventilator + ICU</option>
                            <option value="GENERAL">General Bed</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Allocate Highest Priority</button>
                </form>
            </div>

            <div class="card">
                <h3>⏳ Waitlist Queue</h3>
                <ul id="waitlist-ui" class="waitlist">
                    <li class="empty-state">No patients currently in queue</li>
                </ul>
            </div>
        </aside>

        <!-- Main Content Grid -->
        <main class="main-content">
            <div class="toolbar">
                <h2>Hospital Ward View</h2>
                <div class="filters">
                    <button class="filter-btn active" onclick="filterWards('ALL')">All</button>
                    <button class="filter-btn" onclick="filterWards('ICU')">ICU</button>
                    <button class="filter-btn" onclick="filterWards('GENERAL')">General</button>
                </div>
            </div>

            <div id="ward-grid" class="ward-grid">
                <!-- Dynamic Ward Cards generated by JS -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
