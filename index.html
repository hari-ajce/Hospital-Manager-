<section class="panel" id="transfers">
      <div class="section-heading">
        <div>
          <h2>Ward Transfer Requests</h2>
          <p class="muted">Review and manage demo transfer requests</p>
        </div>
        <button class="primary-btn" onclick="openTransfer()">+ Request Transfer</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Request</th><th>Bed</th><th>From</th><th>To</th><th>Status</th><th>Action</th></tr>
          </thead>
          <tbody id="transferBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="recent">
      <div class="section-heading">
        <div>
          <h2>Recent Bed Activity</h2>
          <p class="muted">Most recently updated beds appear first</p>
        </div>
        <span class="pill">LRU capacity: 10</span>
      </div>
      <div id="recentBeds" class="recent-list"></div>
    </section>

    <footer>© 2026 MediTrack · Frontend demonstration only</footer>
  </main>

  <dialog id="bedDialog">
    <form id="bedForm">
      <div class="dialog-heading">
        <h2 id="bedDialogTitle">Bed Details</h2>
        <button type="button" class="close-btn"
          onclick="closeDialog('bedDialog')">✕</button>
      </div>
      <input type="hidden" id="bedId">
      <p id="bedWardText" class="muted"></p>
      <label for="bedStatus">Bed status</label>
      <select id="bedStatus">
        <option value="Available">Available</option>
        <option value="Occupied">Occupied</option>
        <option value="Cleaning">Cleaning</option>
      </select>
      <div class="dialog-actions">
        <button type="button" class="secondary-btn"
          onclick="closeDialog('bedDialog')">Cancel</button>
        <button type="submit" class="primary-btn">Save Status</button>
      </div>
    </form>
  </dialog>

  <dialog id="transferDialog">
    <form id="transferForm">
      <div class="dialog-heading">
        <h2>New Ward Transfer</h2>
        <button type="button" class="close-btn"
          onclick="closeDialog('transferDialog')">✕</button>
      </div>

      <label for="transferBed">Bed</label>
      <select id="transferBed" required></select>

      <label for="destinationWard">Destination ward</label>
      <select id="destinationWard" required>
        <option value="ICU">ICU</option>
        <option value="General Ward">General Ward</option>
        <option value="Emergency">Emergency</option>
        <option value="Surgery">Surgery</option>
      </select>

      <div class="dialog-actions">
        <button type="button" class="secondary-btn"
          onclick="closeDialog('transferDialog')">Cancel</button>
        <button type="submit" class="primary-btn">Create Request</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
